[project]
name = "gnani-dub-server"
version = "0.1.0"
description = "Local relay for the gnani-dub Chrome extension: Sarvam translation and Gnani TTS / voice cloning"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "numpy>=2.5.4",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
    "websockets>=17.4",
]

[project.scripts]
gnani-dub-server = "gnani_dub_server.app:main"

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"
